{% extends 'base.html' %}
{% load catalog_tags %}
{% block content %}
<div class="container">
    <h4 class="mb-4">Каталог товаров</h4>
<!--    <div class="row row-cols-1  row-cols-sm-2 row-cols-md-3 g-3">-->
    <div class="row row-cols-1  row-cols-2 row-cols-3 g-3">
        {% for product in products %}
        <div class="card h-100 shadow-sm mx-1">
            <img src="{{product.image | media_filter}}" class="w-75 p-3">
            <div class="card-body">
                <h5 class="card-title">{{product.name}}</h5>
                <p class="card-text">{{product.description|truncatechars:100}}</p>
                <p class="fw-bold text-primary">{{product.price}} руб.</p>
                <a href="{% url 'catalog:product_info' product.id %}" class="btn btn-outline-primary">Открыть</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
