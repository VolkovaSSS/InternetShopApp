{% extends 'blog/base.html' %}
{% load static %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Форма удаления статьи</h2>
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Уверены, что хотите удалить: {{object.title}}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-outline-danger">Удалить</button>
                        <a href="{% url 'blog:blogrecord_list' %}" class="btn btn-outline-primary">Отмена</a>
                    </div>
                </div>
            </form>
            <div class="col-3"></div>
        </div>
    </div>
</div>
{% endblock %}
