{% extends 'catalog/base.html' %}
{% block content %}
<div class="container text-start">
    <h3 class="mb-4t">Вход на сайт</h3>
    <div class="row">
        <div class="col-6">
            <form method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.non_field_errors }}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-outline-primary">
                        Войти
                    </button>
                </div>
            </form>
        </div>
        <div class="col-2"></div>
    </div>
</div>
{% endblock %}
